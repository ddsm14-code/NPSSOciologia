<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Encuesta de Satisfacción Universitaria</title>
    
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            touch-action: manipulation;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .contenedor-principal {
            width: 90%;
            max-width: 1200px;
            background-color: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        .titulo { color: #2c3e50; font-size: 3rem; margin-bottom: 10px; font-weight: bold; }
        .subtitulo { font-size: 1.8rem; color: #7f8c8d; margin-bottom: 60px; }
        .pregunta-texto { font-size: 2.2rem; color: #34495e; margin-bottom: 40px; font-weight: 600; }

        .grupo-opciones {
            display: flex; justify-content: space-between; gap: 15px; flex-wrap: wrap;
        }

        .boton-opcion {
            background-color: #ffffff; border: 3px solid #ecf0f1; border-radius: 15px;
            padding: 30px 15px; flex: 1; min-width: 150px; cursor: pointer;
            display: flex; flex-direction: column; align-items: center;
            transition: all 0.2s ease; box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }

        .boton-opcion:hover { border-color: #3498db; background-color: #f0f8ff; transform: translateY(-5px); }
        .boton-opcion:active { transform: scale(0.95); }

        .emoji { font-size: 5rem; margin-bottom: 15px; }
        .etiqueta { font-size: 1.2rem; color: #2c3e50; font-weight: bold; }
        
        .oculto { display: none !important; }

        .mensaje-exito {
            background-color: #e8f8f5; padding: 60px; border-radius: 20px; border: 3px solid #2ecc71;
        }
        .indicador-progreso { margin-top: 40px; color: #bdc3c7; font-size: 1.2rem; font-weight: bold; }

        @media (max-width: 768px) {
            .titulo { font-size: 2rem; }
            .subtitulo { font-size: 1.2rem; }
            .pregunta-texto { font-size: 1.5rem; }
            .emoji { font-size: 3.5rem; }
            .boton-opcion { min-width: 100px; padding: 15px 10px; }
            .etiqueta { font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <div class="contenedor-principal" id="contenedor-encuesta">
        <h1 class="titulo">Encuesta de Servicios Universitarios</h1>
        <p class="subtitulo">Ayúdanos a mejorar tu experiencia en el campus</p>
        
        <div id="area-pregunta">
            <h2 class="pregunta-texto" id="texto-pregunta">Cargando pregunta...</h2>
            
            <div class="grupo-opciones">
                <!-- Se cambió el orden: Excelente primero -->
                <button class="boton-opcion" data-valor="5">
                    <span class="emoji">😁</span>
                    <span class="etiqueta">Excelente</span>
                </button>
                <button class="boton-opcion" data-valor="4">
                    <span class="emoji">🙂</span>
                    <span class="etiqueta">Buena</span>
                </button>
                <button class="boton-opcion" data-valor="3">
                    <span class="emoji">😐</span>
                    <span class="etiqueta">Regular</span>
                </button>
                <button class="boton-opcion" data-valor="2">
                    <span class="emoji">🙁</span>
                    <span class="etiqueta">Mala</span>
                </button>
                <button class="boton-opcion" data-valor="1">
                    <span class="emoji">😠</span>
                    <span class="etiqueta">Muy Mala</span>
                </button>
            </div>
            
            <div class="indicador-progreso" id="indicador-progreso">
                Pregunta 1 de 4
            </div>
        </div>
    </div>

    <div class="contenedor-principal oculto" id="agradecimiento">
        <div class="mensaje-exito">
            <h1 class="titulo">¡Muchas gracias!</h1>
            <p class="subtitulo">Tus respuestas han sido registradas. Seguimos trabajando para ofrecerte lo mejor.</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // =========================================================================
        // 🚨 AQUÍ PONDRÁS TUS LLAVES DE FIREBASE CUANDO LO SUBAS A GITHUB 🚨
        // =========================================================================
        let miConfiguracionFirebase = {
            // apiKey: "TU_API_KEY",
            // authDomain: "TU_DOMINIO.firebaseapp.com",
            // projectId: "TU_PROYECTO"
        };

        // Lógica a prueba de fallos:
        if (typeof __firebase_config !== 'undefined') {
            miConfiguracionFirebase = JSON.parse(__firebase_config); // Usa el entorno inmersivo si existe
        }

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'univ-admin-app';
        const tieneCredenciales = Object.keys(miConfiguracionFirebase).length > 0;
        
        let app, auth, db;
        let conexionActiva = false;

        // Intentamos conectar, si falla, NO detenemos el programa
        if (tieneCredenciales) {
            try {
                app = initializeApp(miConfiguracionFirebase);
                auth = getAuth(app);
                db = getFirestore(app);
                conexionActiva = true;
            } catch (e) {
                console.error("Error conectando a la base de datos:", e);
            }
        } else {
            console.warn("⚠️ MODO SIN CONEXIÓN: Faltan llaves de Firebase. La encuesta se moverá pero no se guardará en la nube.");
        }

        let preguntas = [
            "¿Cómo califica la atención recibida durante su proceso de pago/matrícula?",
            "¿Cómo evalúa el tiempo de espera para ser atendido en ventanilla?",
            "¿Cómo califica la claridad de la información brindada por el personal?",
            "En general, ¿Cómo califica la calidad del servicio administrativo de la universidad hoy?"
        ];
        let preguntaActual = 0;
        let respuestasActuales = {};

        const textoPregunta = document.getElementById('texto-pregunta');
        const indicadorProgreso = document.getElementById('indicador-progreso');
        const botones = document.querySelectorAll('.boton-opcion');
        const contenedorEncuesta = document.getElementById('contenedor-encuesta');
        const seccionAgradecimiento = document.getElementById('agradecimiento');
        const areaPregunta = document.getElementById('area-pregunta');

        function mostrarPregunta() {
            textoPregunta.textContent = preguntas[preguntaActual];
            indicadorProgreso.textContent = `Pregunta ${preguntaActual + 1} de ${preguntas.length}`;
            areaPregunta.style.opacity = 0;
            setTimeout(() => {
                areaPregunta.style.transition = "opacity 0.3s ease";
                areaPregunta.style.opacity = 1;
            }, 50);
        }

        async function registrarRespuesta(evento) {
            const valor = parseInt(evento.currentTarget.getAttribute('data-valor'));
            respuestasActuales[`pregunta_${preguntaActual + 1}`] = valor;
            preguntaActual++;

            if (preguntaActual < preguntas.length) {
                mostrarPregunta();
            } else {
                await finalizarEncuesta();
            }
        }

        async function finalizarEncuesta() {
            contenedorEncuesta.classList.add('oculto');
            seccionAgradecimiento.classList.remove('oculto');
            
            respuestasActuales.fecha = new Date().toISOString();

            // Solo guardamos en la nube si la conexión fue exitosa
            if (conexionActiva && auth && auth.currentUser) {
                try {
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'encuestas'), respuestasActuales);
                    console.log("¡Enviado a la nube con éxito!");
                } catch (e) {
                    console.error("Error al guardar:", e);
                }
            }

            // Reinicio de la encuesta
            setTimeout(() => {
                preguntaActual = 0;
                respuestasActuales = {};
                mostrarPregunta(); 
                seccionAgradecimiento.classList.add('oculto');
                contenedorEncuesta.classList.remove('oculto');
            }, 4000);
        }

        async function iniciarSistema() {
            // Mostramos la primera pregunta INMEDIATAMENTE para que no se congele la pantalla
            mostrarPregunta();
            botones.forEach(boton => boton.addEventListener('click', registrarRespuesta));

            if (conexionActiva) {
                try {
                    if (typeof __initial_auth_token !== 'undefined') {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }

                    // Escuchar si el Admin cambia las preguntas
                    onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'configuracion', 'preguntas'), (docSnap) => {
                        if(docSnap.exists() && docSnap.data().lista) {
                            preguntas = docSnap.data().lista;
                            if(preguntaActual === 0) mostrarPregunta();
                        }
                    });
                } catch (error) {
                    console.error("No se pudo iniciar sesión en la base de datos:", error);
                }
            }
        }

        iniciarSistema();
    </script>
</body>
</html>
